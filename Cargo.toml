[workspace]
members = [
    "crates/rawzelia-app",
    "crates/rawzelia-contract",
    "crates/rawzelia-desktop",
    "crates/rawzelia-domain",
    "crates/rawzelia-imaging",
    "crates/rawzelia-io",
    "crates/rawzelia-lightroom-import",
    "crates/rawzelia-storage",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "MPL-2.0"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
